# autoware_mrm_handler/mrm_handler.launch.xml
# Namespace: /system
#
# Sources:
#   source: autoware_universe/system/autoware_mrm_handler/src/mrm_handler/mrm_handler_core.cpp
version: 1

nodes:
  # Subscribes to MRM behavior statuses, publishes MRM state and vehicle commands
  mrm_handler:
    sub:
      operation_mode_availability:              # ~/input/operation_mode_availability — QoS(1), callback trigger
        state: true
      odometry:                                 # ~/input/odometry — polling
        state: true
      control_mode:                             # ~/input/control_mode — polling
        state: true
      comfortable_stop_status:                  # ~/input/mrm/comfortable_stop/status — polling
        state: true
      emergency_stop_status:                    # ~/input/mrm/emergency_stop/status — polling
        state: true
      operation_mode_state:                     # ~/input/api/operation_mode/state — polling
        state: true
    pub:
      mrm_state: {}                             # ~/output/mrm/state — QoS(1)
      turn_indicators: {}                       # ~/output/turn_indicators — QoS(1)
      hazard_lights: {}                         # ~/output/hazard — QoS(1)
      gear_cmd: {}                              # ~/output/gear — QoS(1)
    cli:                                        # service clients — calls MRM operators
      pull_over_operate: {}                     # ~/output/mrm/pull_over/operate — tier4_system_msgs/srv/OperateMrm
      comfortable_stop_operate: {}              # ~/output/mrm/comfortable_stop/operate — tier4_system_msgs/srv/OperateMrm
      emergency_stop_operate: {}                # ~/output/mrm/emergency_stop/operate — tier4_system_msgs/srv/OperateMrm
imports:
  operation_mode_availability: [mrm_handler/operation_mode_availability]
  odometry: [mrm_handler/odometry]
  comfortable_stop_status: [mrm_handler/comfortable_stop_status]
  emergency_stop_status: [mrm_handler/emergency_stop_status]
  operation_mode_state: [mrm_handler/operation_mode_state]
exports:
  mrm_state: [mrm_handler/mrm_state]
