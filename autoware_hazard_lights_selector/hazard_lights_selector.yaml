# autoware_hazard_lights_selector/hazard_lights_selector.launch.xml
# Namespace: /planning/scenario_planning
#
# Sources:
#   source: autoware_universe/planning/autoware_hazard_lights_selector/src/node.cpp (line 29-45)
version: 1

nodes:
  # Timer-based (10 Hz) — selects between planning and system hazard light commands
  hazard_lights_selector:
    sub:
      hazard_lights_from_planning:              # /planning/behavior_path_planner/hazard_lights_cmd — QoS(1)
        state: true
      hazard_lights_from_system:                # /system/hazard_lights_cmd — QoS(1)
        state: true
    pub:
      hazard_lights_cmd: {}                     # /planning/hazard_lights_cmd — QoS(1)

topics:
  # absolute — hazard signal from behavior planner
  /planning/behavior_path_planner/hazard_lights_cmd:
    type: autoware_vehicle_msgs/msg/HazardLightsCommand  # TODO verify
    sub: [hazard_lights_selector/hazard_lights_from_planning]
    qos:
      reliability: reliable           # QoS(1)
      depth: 1

  # absolute — hazard signal from system (mrm_handler)
  /system/hazard_lights_cmd:
    type: autoware_vehicle_msgs/msg/HazardLightsCommand  # TODO verify
    sub: [hazard_lights_selector/hazard_lights_from_system]
    qos:
      reliability: reliable           # QoS(1)
      depth: 1

  # absolute — selected hazard signal published to vehicle
  /planning/hazard_lights_cmd:
    type: autoware_vehicle_msgs/msg/HazardLightsCommand  # TODO verify
    pub: [hazard_lights_selector/hazard_lights_cmd]
    qos:
      reliability: reliable           # QoS(1)
      depth: 1
