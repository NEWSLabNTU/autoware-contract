# tier4_map_launch/map.launch.xml
# Namespace: /map
#
# Map loading: pointcloud map, lanelet2 vector map, map projection,
# TF generation. Has own composable nodes in map_container.
#
# Source: /opt/autoware/1.5.0/share/tier4_map_launch/launch/map.launch.xml

version: 1

# Composable nodes in map_container
nodes:
  pointcloud_map_loader:
    pub:
      pointcloud_map: {}
    srv:
      get_partial_pcd_map: {}
      get_differential_pcd_map: {}
      get_selected_pcd_map: {}

  lanelet2_map_loader:
    pub:
      vector_map: {}           # /map/vector_map — QoS(1).transient_local()

  lanelet2_map_visualization:
    sub:
      vector_map:
        state: true
    pub:
      visualization: {}

  vector_map_tf_generator:
    sub:
      vector_map:
        state: true

  map_hash_generator:
    pub:
      map_hash: {}

includes:
  map_projection_loader:
    manifest: autoware_map_projection_loader/map_projection_loader.yaml

topics:
  # /map/vector_map — published by lanelet2_map_loader, consumed locally too
  vector_map:
    type: autoware_map_msgs/msg/LaneletMapBin  # confirmed by Phase 36 runtime enforcement
    pub: [lanelet2_map_loader/vector_map]
    sub:
      - lanelet2_map_visualization/vector_map
      - vector_map_tf_generator/vector_map
    qos:
      reliability: reliable       # transient_local in source
      durability: transient_local
      depth: 1

  # /map/pointcloud_map — published by pointcloud_map_loader
  pointcloud_map:
    type: sensor_msgs/msg/PointCloud2  # declared from upstream msg pkg / cross-leaf consistency
    pub: [pointcloud_map_loader/pointcloud_map]

  # /map/map_hash — map fingerprint
  map_hash:
    type: tier4_external_api_msgs/msg/MapHash  # declared from upstream msg pkg / cross-leaf consistency
    pub: [map_hash_generator/map_hash]

  # /map/lanelet2_map_visualization output marker stream
  visualization:
    type: visualization_msgs/msg/MarkerArray  # declared from upstream msg pkg / cross-leaf consistency
    pub: [lanelet2_map_visualization/visualization]

  # Pre-remap and additional published aliases. lanelet2_map_loader,
  # pointcloud_map_loader and lanelet2_map_visualization expose their
  # endpoints on their own node namespaces as well as the
  # /map/<canonical> remapped form. Declared so the runtime engine
  # type-checks them.
  /map/vector_map_marker:
    type: visualization_msgs/msg/MarkerArray
    pub: [lanelet2_map_visualization/visualization]
    qos: { reliability: reliable, durability: transient_local, depth: 1 }
  /map/input/lanelet2_map:
    type: autoware_map_msgs/msg/LaneletMapBin
    sub: [lanelet2_map_visualization/vector_map]
    qos: { reliability: reliable, durability: transient_local, depth: 1 }
  /map/output/lanelet2_map_marker:
    type: visualization_msgs/msg/MarkerArray
    pub: [lanelet2_map_visualization/visualization]
    qos: { reliability: reliable, durability: transient_local, depth: 1 }
  /map/output/pointcloud_map:
    type: sensor_msgs/msg/PointCloud2
    pub: [pointcloud_map_loader/pointcloud_map]
    qos: { reliability: reliable, durability: transient_local, depth: 1 }

services:
  # /map/get_partial_pcd_map — pcd map slice retrieval
  get_partial_pcd_map:
    type: autoware_map_msgs/srv/GetPartialPointCloudMap  # declared from upstream msg pkg / cross-leaf consistency
    server: [pointcloud_map_loader/get_partial_pcd_map]
  get_differential_pcd_map:
    type: autoware_map_msgs/srv/GetDifferentialPointCloudMap  # declared from upstream msg pkg / cross-leaf consistency
    server: [pointcloud_map_loader/get_differential_pcd_map]
  get_selected_pcd_map:
    type: autoware_map_msgs/srv/GetSelectedPointCloudMap  # declared from upstream msg pkg / cross-leaf consistency
    server: [pointcloud_map_loader/get_selected_pcd_map]
