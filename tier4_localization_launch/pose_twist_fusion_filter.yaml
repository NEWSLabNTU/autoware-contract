# tier4_localization_launch/pose_twist_fusion_filter/pose_twist_fusion_filter.launch.xml
# Namespace: /localization/pose_twist_fusion_filter
#
# EKF-based pose/twist fusion: combines estimator outputs into a single
# kinematic state. Includes stop filter, twist-to-acceleration converter,
# and pose instability detector.
#
# Source: /opt/autoware/1.5.0/share/tier4_localization_launch/launch/pose_twist_fusion_filter/pose_twist_fusion_filter.launch.xml

version: 1

# No leaf manifests for these children yet — they are simple single-node
# launch files. Listed as includes for tree completeness.
includes:
  # ekf_localizer: EKF fusion node
  # stop_filter: detects vehicle stop state
  # twist2accel: converts twist to acceleration
  # pose_instability_detector: monitors pose stability

# TODO: leaf manifests for ekf_localizer/stop_filter/twist2accel/
# pose_instability_detector are not yet authored; topics below are
# placeholders capturing the scope's external interface.
topics:
  # Pose/twist inputs from estimators (consumed by ekf_localizer)
  pose_with_covariance:
    type: geometry_msgs/msg/PoseWithCovarianceStamped  # declared from upstream msg pkg / cross-leaf consistency
    # sub: []  # populated by ekf_localizer leaf manifest when authored
  twist_with_covariance:
    type: geometry_msgs/msg/TwistWithCovarianceStamped  # declared from upstream msg pkg / cross-leaf consistency
    # sub: []  # populated by gyro_odometer/eagleye leaf manifest when authored

  # Fused outputs to planning/control — published from /localization scope
  # Declared absolute since these resolve to /localization/* (not the
  # fusion_filter sub-namespace).
  /localization/kinematic_state:
    type: nav_msgs/msg/Odometry  # confirmed by Phase 36 runtime enforcement
    # pub: []  # populated by ekf_localizer leaf manifest when authored
  /localization/acceleration:
    type: geometry_msgs/msg/AccelWithCovarianceStamped  # confirmed by Phase 36 runtime enforcement
    # pub: []  # populated by twist2accel leaf manifest when authored
