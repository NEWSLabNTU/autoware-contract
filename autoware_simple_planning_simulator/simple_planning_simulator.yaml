# autoware_simple_planning_simulator/simple_planning_simulator.launch.py
# Namespace: / (node at /simulation/...)
#
# Sources:
#   source: autoware_universe/simulator/autoware_simple_planning_simulator/src/simple_planning_simulator_core.cpp (line 118-194)
version: 1

nodes:
  # Timer-driven (40 Hz default) — simulates vehicle dynamics
  simple_planning_simulator:
    sub:
      control_cmd:                              # /control/command/control_cmd — QoS(1)
        min_rate_hz: 30
      gear_cmd:                                 # /control/command/gear_cmd — QoS(1)
        state: true
      turn_indicators_cmd:                      # /control/command/turn_indicators_cmd — QoS(1)
        state: true
      hazard_lights_cmd:                        # /control/command/hazard_lights_cmd — QoS(1)
        state: true
      initial_pose:                             # /initialpose3d — QoS(1)
        state: true
      vector_map:                               # /map/vector_map — QoS(10).transient_local()
        state: true
      trajectory:                               # /planning/trajectory — QoS(1)
        state: true
      engage:                                   # /vehicle/engage — QoS(1)
        state: true
    pub:
      odometry:                                 # output/odometry → /localization/kinematic_state — QoS(1)
        min_rate_hz: 40                         # timer-driven at sim_hz (default 40)
      velocity_status:                          # output/twist → /vehicle/status/velocity_status — QoS(1)
        min_rate_hz: 40
      steering_status:                          # output/steering → /vehicle/status/steering_status — QoS(1)
        min_rate_hz: 40
      acceleration:                             # output/acceleration — QoS(1)
        min_rate_hz: 40
      imu:                                      # output/imu → /sensing/imu/imu_data — QoS(1)
        min_rate_hz: 40
      control_mode:                             # output/control_mode_report — QoS(1)
        min_rate_hz: 40
      gear_status: {}                           # output/gear_report — QoS(1)
      turn_indicators_status: {}                # output/turn_indicators_report — QoS(1)
      hazard_lights_status: {}                  # output/hazard_lights_report — QoS(1)
    srv:
      control_mode_request:                     # input/control_mode_request — autoware_vehicle_msgs/srv/ControlModeCommand — SERVER
        # simulation only — no response time requirement
      set_pose:                                 # /api/simulator/set/pose — tier4_external_api_msgs/srv/InitializePose — SERVER
        # simulation only — no response time requirement
    paths:
      periodic:                                 # timer-driven — rate independent of upstream
        input: []
        output: [odometry, velocity_status, steering_status, acceleration]
        max_latency_ms: 5

services:
  control_mode_request:
    type: autoware_vehicle_msgs/srv/ControlModeCommand
    server: [simple_planning_simulator/control_mode_request]
  set_pose:
    type: tier4_external_api_msgs/srv/InitializePose
    server: [simple_planning_simulator/set_pose]

imports:
  control_cmd: [simple_planning_simulator/control_cmd]
exports:
  odometry: [simple_planning_simulator/odometry]
  velocity_status: [simple_planning_simulator/velocity_status]
  steering_status: [simple_planning_simulator/steering_status]
  acceleration: [simple_planning_simulator/acceleration]
  imu: [simple_planning_simulator/imu]
