# autoware_simple_planning_simulator/simple_planning_simulator.launch.py
# Namespace: / (node at /simulation/...)
#
# Sources:
#   source: autoware_universe/simulator/autoware_simple_planning_simulator/src/simple_planning_simulator_core.cpp (line 118-194)

# Args from simple_planning_simulator.launch.py
# motion_publish_mode changes topic remapping — pose_only publishes to
# /simulation/debug/... while full_motion publishes to /localization/...
# The node always exists; only the output remaps change (not node-level if:).
args:
  motion_publish_mode:              # changes output topic remapping
    choices: [full_motion, pose_only]

version: 1

nodes:
  # Timer-driven (40 Hz default) — simulates vehicle dynamics
  simple_planning_simulator:
    sub:
      control_cmd:                              # /control/command/control_cmd — QoS(1)
        min_rate_hz: 30
        state: true                               # polled: lambda-store + 40 Hz timer read (simple_planning_simulator.cpp); same pattern as gear_cmd et al. Breaks the vehicle_cmd_gate→sim→controller cycle (play_launch Phase 42 study Q1).
      gear_cmd:                                 # /control/command/gear_cmd — QoS(1)
        state: true
      turn_indicators_cmd:                      # /control/command/turn_indicators_cmd — QoS(1)
        state: true
      hazard_lights_cmd:                        # /control/command/hazard_lights_cmd — QoS(1)
        state: true
      initial_pose:                             # /initialpose3d — QoS(1)
        state: true
      vector_map:                               # /map/vector_map — QoS(10).transient_local()
        state: true
      trajectory:                               # /planning/trajectory — QoS(1)
        state: true
      engage:                                   # /vehicle/engage — QoS(1)
        state: true
    pub:
      odometry:                                 # output/odometry → /localization/kinematic_state — QoS(1)
        min_rate_hz: 40                         # timer-driven at sim_hz (default 40)
      velocity_status:                          # output/twist → /vehicle/status/velocity_status — QoS(1)
        min_rate_hz: 40
      steering_status:                          # output/steering → /vehicle/status/steering_status — QoS(1)
        min_rate_hz: 40
      acceleration:                             # output/acceleration — QoS(1)
        min_rate_hz: 40
      imu:                                      # output/imu → /sensing/imu/imu_data — QoS(1)
        min_rate_hz: 40
      control_mode:                             # output/control_mode_report — QoS(1)
        min_rate_hz: 40
      gear_status: {}                           # output/gear_report — QoS(1)
      turn_indicators_status: {}                # output/turn_indicators_report — QoS(1)
      hazard_lights_status: {}                  # output/hazard_lights_report — QoS(1)
    srv:
      control_mode_request:                     # input/control_mode_request — autoware_vehicle_msgs/srv/ControlModeCommand — SERVER
        # simulation only — no response time requirement
      set_pose:                                 # /api/simulator/set/pose — tier4_external_api_msgs/srv/InitializePose — SERVER
        # simulation only — no response time requirement
    paths:
      periodic:
        # Timer at timer_sampling_time_ms (25ms default -> 40Hz), self-clocked;
        # all 9 subs are lambda take-latest, read only inside on_timer().
        # simple_planning_simulator_core.cpp:192-194 (timer), :464-529 (on_timer
        # publishes). P44 W3 census. Default period confirmed:
        # autoware_simple_planning_simulator/param/simple_planning_simulator_default.param.yaml:7.
        trigger: { timer: { rate_hz: 40 } }
        output: [odometry, velocity_status, steering_status, acceleration]
        max_latency_ms: 5

topics:
  # Subscriptions — absolute ROS names (cross-scope inputs)
  # Topic-level QoS reflects the publisher (vehicle_cmd_gate, durable_qos = QoS(1).transient_local()).
  # SPS subscriber itself uses QoS{1} (volatile) — DDS-compatible with the durable publisher.
  /control/command/control_cmd:
    type: autoware_control_msgs/msg/Control
    sub: [simple_planning_simulator/control_cmd]
    qos:
      reliability: reliable           # publisher QoS(1).transient_local()
      durability: transient_local
      depth: 1
  /control/command/gear_cmd:
    type: autoware_vehicle_msgs/msg/GearCommand
    sub: [simple_planning_simulator/gear_cmd]
    qos:
      reliability: reliable
      durability: transient_local
      depth: 1
  /control/command/turn_indicators_cmd:
    type: autoware_vehicle_msgs/msg/TurnIndicatorsCommand
    sub: [simple_planning_simulator/turn_indicators_cmd]
    qos:
      reliability: reliable
      durability: transient_local
      depth: 1
  /control/command/hazard_lights_cmd:
    type: autoware_vehicle_msgs/msg/HazardLightsCommand
    sub: [simple_planning_simulator/hazard_lights_cmd]
    qos:
      reliability: reliable
      durability: transient_local
      depth: 1
  /initialpose3d:
    type: geometry_msgs/msg/PoseWithCovarianceStamped
    sub: [simple_planning_simulator/initial_pose]
    qos:
      reliability: reliable           # QoS(1)
      depth: 1
  # UPSTREAM: simple_planning_simulator subscribes with QoS(10).transient_local() but the
  # actual publisher (autoware_map_loader / lanelet2_map_loader_node.cpp:130) uses
  # rclcpp::QoS{1}.transient_local(). Authoritative QoS = publisher; aligned to depth=1.
  # Source: src/core/autoware_core/map/autoware_map_loader/src/lanelet2_map_loader/lanelet2_map_loader_node.cpp:130
  /map/vector_map:
    type: autoware_map_msgs/msg/LaneletMapBin
    sub: [simple_planning_simulator/vector_map]
    qos:
      reliability: reliable           # publisher: QoS(1).transient_local() (subscriber source: QoS(10))
      durability: transient_local
      depth: 1
  /planning/trajectory:
    type: autoware_planning_msgs/msg/Trajectory
    sub: [simple_planning_simulator/trajectory]
    qos:
      reliability: reliable           # QoS(1)
      depth: 1
  /vehicle/engage:
    type: autoware_vehicle_msgs/msg/Engage
    sub: [simple_planning_simulator/engage]
    qos:
      reliability: reliable           # QoS(1)
      depth: 1

  # Publications — absolute ROS names per remapping in launch file
  /localization/kinematic_state:
    type: nav_msgs/msg/Odometry
    pub: [simple_planning_simulator/odometry]
    rate_hz: 40
    qos:
      reliability: reliable           # QoS(1)
      depth: 1
  /vehicle/status/velocity_status:
    type: autoware_vehicle_msgs/msg/VelocityReport
    pub: [simple_planning_simulator/velocity_status]
    rate_hz: 40
    qos:
      reliability: reliable           # QoS(1)
      depth: 1
  /vehicle/status/steering_status:
    type: autoware_vehicle_msgs/msg/SteeringReport
    pub: [simple_planning_simulator/steering_status]
    rate_hz: 40
    qos:
      reliability: reliable           # QoS(1)
      depth: 1
  # /localization/acceleration — confirmed by Phase 36 runtime enforcement
  /localization/acceleration:
    type: geometry_msgs/msg/AccelWithCovarianceStamped
    pub: [simple_planning_simulator/acceleration]
    rate_hz: 40
    qos:
      reliability: reliable           # QoS(1)
      depth: 1
  /sensing/imu/imu_data:
    type: sensor_msgs/msg/Imu
    pub: [simple_planning_simulator/imu]
    rate_hz: 40
    qos:
      reliability: reliable           # QoS(1)
      depth: 1
  /vehicle/status/control_mode:
    type: autoware_vehicle_msgs/msg/ControlModeReport
    pub: [simple_planning_simulator/control_mode]
    rate_hz: 40
    qos:
      reliability: reliable           # QoS(1)
      depth: 1
  /vehicle/status/gear_status:
    type: autoware_vehicle_msgs/msg/GearReport
    pub: [simple_planning_simulator/gear_status]
    qos:
      reliability: reliable           # QoS(1)
      depth: 1
  /vehicle/status/turn_indicators_status:
    type: autoware_vehicle_msgs/msg/TurnIndicatorsReport
    pub: [simple_planning_simulator/turn_indicators_status]
    qos:
      reliability: reliable           # QoS(1)
      depth: 1
  /vehicle/status/hazard_lights_status:
    type: autoware_vehicle_msgs/msg/HazardLightsReport
    pub: [simple_planning_simulator/hazard_lights_status]
    qos:
      reliability: reliable           # QoS(1)
      depth: 1

services:
  control_mode_request:
    type: autoware_vehicle_msgs/srv/ControlModeCommand
    server: [simple_planning_simulator/control_mode_request]
  set_pose:
    type: tier4_external_api_msgs/srv/InitializePose
    server: [simple_planning_simulator/set_pose]
