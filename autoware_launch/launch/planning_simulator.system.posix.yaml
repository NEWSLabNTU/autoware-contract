# TEMPORARY platform overlay for P44 W6 chain_aware-at-scale validation.
# Root-scope posix platform file for planning_simulator.launch.xml, same
# layout convention as the contract overlay: <pkg>/launch/<stem>.system.
# <target>.yaml, same <stem> as autoware_launch/launch/
# planning_simulator.contract.yaml.
#
# Supersedes (for this validation run only) the Phase 41 `rate_monotonic`
# platform file recorded on the unmerged `rt/v2-platform` branch of this
# repo (never merged to main) — this file is NOT meant to replace that
# work; it exists to exercise `chain_aware` end-to-end against a real,
# large (75+ contract) corpus per Phase 44 W6. `mapper: chain_aware` is the
# only functional change from that branch's platform file; band widened to
# 5-45 per the W6 task brief (was 5-45 already on rt/v2-platform — kept
# unchanged) and the two Phase 41.5 overrides are carried forward verbatim
# (same FQNs, confirmed against a real `play_launch dump` of this launch
# file — see W6 report).
target: posix
mapper: chain_aware

resources:
  # Same band as the (unmerged) Phase 41 rt/v2-platform platform file:
  # widened at the bottom (5, not rt_workspace demo's 10) because Autoware's
  # derived rate/chain spread is wide across 119 entities.
  rt_priority_band: { min: 5, max: 45 }

overrides:
  # Phase 41 overrides, carried forward unchanged (confirmed against
  # `play_launch dump`'s load_node FQNs: namespace=/control/
  # trajectory_follower, node_name=controller_node_exe; namespace=/control,
  # node_name=vehicle_cmd_gate — see tests/fixtures/autoware, W6 report).
  # Both are `criticality: high` where declared in their own contracts
  # (control.contract.yaml) — not consumed by chain_aware's ranking today
  # (chain_aware ranks by chain membership + criticality-desc chain
  # ordering, not per-node override input) but these overrides still win
  # downstream of the mapper, same as under rate_monotonic.
  /control/trajectory_follower/controller_node_exe: { priority: 40 }
  /control/vehicle_cmd_gate: { priority: 39 }
