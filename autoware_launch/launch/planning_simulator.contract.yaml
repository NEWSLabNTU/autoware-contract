  /system/velocity_limit/clear: { external: sub }
  /diagnostics_graph/unknowns: { external: sub }
  # Out-of-tree consumers (downstream Autoware nodes not yet manifested)
  /control/command/emergency_cmd: { external: sub }
  /external/selected/control_cmd: { external: sub }
  /external/selected/hazard_lights_cmd: { external: sub }
  /external/selected/turn_indicators_cmd: { external: sub }
  /perception/object_recognition/detection/objects: { external: sub }
  /planning/hazard_lights_cmd: { external: sub }
  /planning/turn_indicators_cmd: { external: sub }
  /planning/scenario_planning/current_max_velocity: { external: sub }
  /planning/scenario_planning/parking/costmap_generator/grid_map: { external: sub }
  /planning/scenario_planning/velocity_smoother/trajectory: { external: sub }
  /map/map_projector_info: { external: sub }
  /map_hash: { external: sub }
  /pointcloud_map: { external: sub }

  # Re-added after v2 audit overshot — these are leaf-declared but
  # the include's scope ns may differ from naive walk; keeping them as
  # `external: both` is safe (the leaf still owns pub/sub, this entry
  # just satisfies the runtime topic_hash → FQN coverage check).
  /control/gate_mode_cmd: { external: sub, type: tier4_control_msgs/msg/GateMode }
