# autoware_pose_initializer/pose_initializer.launch.xml
# Namespace: /
#
# Sources:
#   source: autoware_core/localization/autoware_pose_initializer/src/pose_initializer_core.cpp
version: 1

nodes:
  pose_initializer:
    sub:
      gnss_pose:                                # state: optional GNSS input for initial pose
        state: true
      point_cloud_map:                          # state: for NDT-based initialization
        state: true
    pub:
      initialpose3d: {}                         # /initialpose3d — published after initialization
    srv:
      initialize:                               # autoware component_interface_specs::localization::Initialize — SERVER
        # no documented response time requirement — NDT alignment is iterative, map-dependent

topics:
  # gnss_pose — relative; resolves via scope ns
  gnss_pose:
    type: geometry_msgs/msg/PoseWithCovarianceStamped  # TODO verify
    sub: [pose_initializer/gnss_pose]
  # point_cloud_map — pcd map source for NDT initialization
  point_cloud_map:
    type: sensor_msgs/msg/PointCloud2  # TODO verify
    sub: [pose_initializer/point_cloud_map]
  # initialpose3d — published initialization result
  initialpose3d:
    type: geometry_msgs/msg/PoseWithCovarianceStamped  # TODO verify
    pub: [pose_initializer/initialpose3d]

services:
  # NDT-based pose initialization service
  initialize:
    type: autoware_component_interface_specs/localization/Initialize
    server: [pose_initializer/initialize]
