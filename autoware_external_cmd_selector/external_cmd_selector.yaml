# autoware_external_cmd_selector/external_cmd_selector.launch.py
# Namespace: /control
#
# Sources:
#   source: autoware_universe/control/autoware_external_cmd_selector/src/external_cmd_selector/external_cmd_selector_node.cpp
version: 1

nodes:
  # Selects between local and remote manual control inputs
  external_cmd_selector:
    sub:
      local_pedals_cmd:                         # ~/input/local/pedals_cmd — QoS(1)
        state: true
      local_steering_cmd:                       # ~/input/local/steering_cmd — QoS(1)
        state: true
      local_heartbeat:                          # ~/input/local/heartbeat — QoS(1)
        state: true
      remote_pedals_cmd:                        # ~/input/remote/pedals_cmd — QoS(1)
        state: true
      remote_steering_cmd:                      # ~/input/remote/steering_cmd — QoS(1)
        state: true
      remote_heartbeat:                         # ~/input/remote/heartbeat — QoS(1)
        state: true
    pub:
      current_selector_mode: {}                 # ~/output/current_selector_mode — QoS(1)
      selected_pedals_cmd: {}                   # ~/output/pedals_cmd — QoS(1)
      selected_steering_cmd: {}                 # ~/output/steering_cmd — QoS(1)
      selected_heartbeat: {}                    # ~/output/heartbeat — QoS(1)
    srv:
      select_external_command: {}               # ~/service/select_external_command — ExternalCommandSelect

services:
  select_external_command:
    type: tier4_control_msgs/srv/ExternalCommandSelect
    server: [external_cmd_selector/select_external_command]

pub:
  selector_mode: [external_cmd_selector/current_selector_mode]
