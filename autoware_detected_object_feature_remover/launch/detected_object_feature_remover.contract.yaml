# autoware_detected_object_feature_remover/detected_object_feature_remover.launch.xml
# Namespace: /simulation
#
# Sources:
#   source: autoware_universe/perception/autoware_detected_object_feature_remover/
version: 1

nodes:
  detected_object_feature_remover:
    sub:
      input:                                    # ~/input → /perception/object_recognition/detection/objects_with_feature
        min_rate_hz: 10
    pub:
      output:                                   # ~/output → /perception/object_recognition/detection/objects
        min_rate_hz: 10
    paths:
      main:
        input: input
        output: [output]
        max_latency: 5ms                       # simple field removal, no computation

topics:
  # absolute — input from shape_estimation (remap: ~/input → /perception/object_recognition/detection/objects_with_feature)
  # Source: src/universe/autoware_universe/perception/autoware_detected_object_feature_remover/src/detected_object_feature_remover_node.hpp:23
  # type confirmed: tier4_perception_msgs::msg::DetectedObjectsWithFeature
  /perception/object_recognition/detection/objects_with_feature:
    type: tier4_perception_msgs/msg/DetectedObjectsWithFeature
    sub: [detected_object_feature_remover/input]

  # absolute — feature-stripped detected objects (remap: ~/output → /perception/object_recognition/detection/objects)
  /perception/object_recognition/detection/objects:
    type: autoware_perception_msgs/msg/DetectedObjects
    pub: [detected_object_feature_remover/output]
    rate_hz: 10
    qos:
      reliability: reliable           # QoS(1)
      depth: 1
