# autoware_multi_object_tracker/multi_object_tracker.launch.xml
# Namespace: /perception/object_recognition/tracking
#
# Sources:
#   launch:  /opt/autoware/1.5.0/share/autoware_multi_object_tracker/launch/multi_object_tracker.launch.xml
#   source:  autoware_universe/perception/autoware_multi_object_tracker/src/multi_object_tracker_node.cpp

# Args from multi_object_tracker.launch.xml
# Note: input channel topics are configured via a param YAML file, not launch args.
# The input_channels_path arg points to the config file.
args:
  input_channels_path:                          # required — path to input channel config YAML

version: 1

nodes:
  # --- Multi Object Tracker ---
  # Regular node (not composable)
  # Execution: timer-based (publish_rate param × 10 internal rate), with delay compensation
  multi_object_tracker:
    sub:
      detected_objects:             # input/objects01..12 — up to 12 detection channels, QoS(1)
        min_rate_hz: 10             # from upstream detectors (lidar, camera, radar)
      odometry:                     # not explicitly remapped — /localization/kinematic_state
        state: true
    pub:
      tracked_objects:              # output/objects — QoS(1)
        min_rate_hz: 10             # publish_rate param (default ~10 Hz)
    # No `paths:` block — the `detected_objects` fan-in is parameterized per
    # launch via `input/detectionNN/objects` args, so we can't declare a
    # topic-level wiring without a placeholder. The latency contract
    # (~20ms detected_objects→tracked_objects) is enforced at runtime by
    # the tracker itself.

topics:
  # Detected objects fan-in: the tracker subscribes to up to 12 input channels
  # (`input/objects01..12`) whose ROS names are configured per launch
  # invocation via `input/detectionNN/objects` args. The actual topics vary
  # per pipeline. The `detected_objects` endpoint above is the contract;
  # per-channel wiring is validated at runtime by the tracker itself.
  # No placeholder topic entry here.

  # /localization/kinematic_state — from EKF
  /localization/kinematic_state:
    type: nav_msgs/msg/Odometry
    sub: [multi_object_tracker/odometry]

  # relative → /perception/object_recognition/tracking/objects → map_based_prediction
  objects:
    type: autoware_perception_msgs/msg/TrackedObjects
    pub: [multi_object_tracker/tracked_objects]
    rate_hz: 10
    qos:
      reliability: reliable           # QoS(1)
      depth: 1
