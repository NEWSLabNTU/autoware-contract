# autoware_pipeline_latency_monitor/pipeline_latency_monitor.launch.xml
# Namespace: /system
#
# Monitors end-to-end pipeline latency by subscribing to a configured set of
# topics and publishes a diagnostic.
version: 1

nodes:
  pipeline_latency_monitor:
    # Phase 41.5 mapper hint: low — observability/diagnostics only; monitors
    # the pipeline, does not participate in it, so it has no control-loop
    # deadline of its own.
    criticality: low
    sub:
      topics_to_monitor:
        state: true
    pub:
      diagnostic: {}

topics:
  # The set of topics aggregated for latency is configured per invocation via
  # launch args; the actual ROS names vary. The `topics_to_monitor` endpoint
  # above is the contract — per-invocation wiring is validated at runtime by
  # the pipeline_latency_monitor itself. No placeholder topic entry here.

  # absolute — global diagnostics aggregation channel
  /diagnostics:
    type: diagnostic_msgs/msg/DiagnosticArray
    pub: [pipeline_latency_monitor/diagnostic]
