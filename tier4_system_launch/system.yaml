# tier4_system_launch/system.launch.xml
# Namespace: /system
#
# System health monitoring, MRM (Minimal Risk Maneuver) handling,
# and diagnostic aggregation. This is the parent scope that wires
# MRM handler (client) to MRM operators (servers).
#
# Source: /opt/autoware/1.5.0/share/tier4_system_launch/launch/system.launch.xml
version: 1

args:
  use_control_command_gate:
    type: bool
  launch_system_monitor:
    type: bool
  launch_dummy_diag_publisher:
    type: bool

includes:
  # --- Always present ---
  duplicated_node_checker:
    manifest: autoware_duplicated_node_checker/duplicated_node_checker.yaml
  processing_time_checker:
    manifest: autoware_processing_time_checker/processing_time_checker.yaml
  pipeline_latency_monitor:
    manifest: autoware_pipeline_latency_monitor/pipeline_latency_monitor.yaml
  service_log_checker:
    manifest: autoware_component_interface_tools/service_log_checker.yaml
  component_state_monitor:
    manifest: autoware_component_state_monitor/component_state_monitor.yaml
  mrm_emergency_stop_operator:
    manifest: autoware_mrm_emergency_stop_operator/mrm_emergency_stop_operator.yaml
  aggregator:
    manifest: autoware_diagnostic_graph_aggregator/aggregator.yaml
  hazard_status_converter:
    manifest: autoware_hazard_status_converter/hazard_status_converter.yaml

  # --- Conditional: unless use_control_command_gate ---
  mrm_comfortable_stop_operator:
    unless: $(var use_control_command_gate)
    manifest: autoware_mrm_comfortable_stop_operator/mrm_comfortable_stop_operator.yaml
  mrm_handler:
    unless: $(var use_control_command_gate)
    manifest: autoware_mrm_handler/mrm_handler.yaml

  # --- Conditional: if launch_system_monitor ---
  # system_monitor: no manifest (hardware monitoring, not in scope)

# Cross-scope service wiring is automatic — clients in mrm_handler.yaml
# and servers in mrm_*_operator.yaml share /system as scope ns and use
# matching ROS service names (mrm/comfortable_stop/operate etc.). The
# checker merges declarations by FQN, so no `services:` block is needed
# here. The pull_over operator is not in planning_simulator (real-vehicle
# only) — its dangling-entity warning is an accepted gap.
