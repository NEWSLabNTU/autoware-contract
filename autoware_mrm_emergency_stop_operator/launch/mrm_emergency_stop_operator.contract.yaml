# autoware_mrm_emergency_stop_operator/mrm_emergency_stop_operator.launch.py
# Namespace: /system
#
# Sources:
#   source: autoware_universe/system/autoware_mrm_emergency_stop_operator/src/mrm_emergency_stop_operator.cpp
version: 1

nodes:
  mrm_emergency_stop_operator:
    sub:
      control_cmd:                              # ~/input/control/control_cmd — QoS(1)
        state: true
    pub:
      mrm_status: {}                            # ~/output/mrm/emergency_stop/status — QoS(1)
      mrm_control_cmd: {}                       # ~/output/mrm/emergency_stop/control_cmd — QoS(1)
    srv:
      operate:                                  # ~/input/mrm/emergency_stop/operate — OperateMrm
        # safety-critical (emergency) — no documented response time requirement

topics:
  # absolute — control command from upstream control stack
  # Topic-level QoS aligned with vehicle_cmd_gate publisher (QoS(1).transient_local).
  /control/command/control_cmd:
    type: autoware_control_msgs/msg/Control
    sub: [mrm_emergency_stop_operator/control_cmd]
    qos:
      reliability: reliable           # publisher QoS(1).transient_local()
      durability: transient_local
      depth: 1

  # relative → /system/mrm/emergency_stop/status
  mrm/emergency_stop/status:
    type: tier4_system_msgs/msg/MrmBehaviorStatus  # declared from upstream msg pkg / cross-leaf consistency
    pub: [mrm_emergency_stop_operator/mrm_status]
    qos:
      reliability: reliable           # QoS(1)
      depth: 1

  # relative → /system/mrm/emergency_stop/control_cmd
  mrm/emergency_stop/control_cmd:
    type: autoware_control_msgs/msg/Control
    pub: [mrm_emergency_stop_operator/mrm_control_cmd]
    qos:
      reliability: reliable           # QoS(1)
      depth: 1

services:
  # relative → /system/mrm/emergency_stop/operate
  mrm/emergency_stop/operate:
    type: tier4_system_msgs/srv/OperateMrm
    server: [mrm_emergency_stop_operator/operate]
    # client is mrm_handler (cross-scope, declared in tier4_system_launch/system.yaml)
