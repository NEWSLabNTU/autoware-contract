# tier4_planning_launch/motion_planning.launch.xml
# Namespace: /planning/scenario_planning/lane_driving/motion_planning
#
# Sources:
#   launch:    /opt/autoware/1.5.0/share/tier4_planning_launch/launch/scenario_planning/lane_driving/motion_planning/motion_planning.launch.xml
#   smoother:  autoware_universe/planning/autoware_path_smoother/src/elastic_band_smoother.cpp
#   optimizer: autoware_universe/planning/autoware_path_optimizer/src/node.cpp
#   velocity:  autoware_core/planning/motion_velocity_planner/autoware_motion_velocity_planner/src/node.cpp

# Args from motion_planning.launch.xml <arg> declarations
#
# Note: motion_path_smoother_type (elastic_band/none) and
# motion_path_planner_type (path_optimizer/path_sampler/none) select between
# implementations. These are plugin-level conditions inside the same
# composable node container — not node-level if: (see notes.md #7).
# launch_surround_obstacle_checker is also a module toggle.
args:
  input_objects_topic_name:
  input_pointcloud_topic_name:
  use_multithread:

version: 1

nodes:
  # --- Elastic Band Smoother ---
  # plugin: autoware::path_smoother::ElasticBandSmoother
  # Remaps: ~/input/path → $(var interface_input_topic), ~/input/odometry → /localization/kinematic_state
  #         ~/output/path → path_smoother/path
  elastic_band_smoother:
    sub:
      input_path:               # behavior_planning/path — remap ~/input/path
        min_rate_hz: 10         # triggered by upstream behavior planner
        max_age: 200ms         # E2E freshness incl. upstream behavior planning latency
      odometry:                 # /localization/kinematic_state — InterProcessPollingSubscriber
        state: true
    pub:
      output_path:              # path_smoother/path — remap ~/output/path
        min_rate_hz: 10
    paths:
      smooth_path:              # P44 W6: renamed from `main` — unique path name
                                 # required for chain `{scope, path}` resolution
                                 # (this scope hosts 3 nodes that all used `main`).
        input: input_path
        output: [output_path]
        max_latency: 10ms      # elastic band optimization is iterative but fast

  # --- Path Optimizer ---
  # plugin: autoware::path_optimizer::PathOptimizer
  # Remaps: ~/input/path → path_smoother/path, ~/input/odometry → /localization/kinematic_state
  #         ~/output/path → path_optimizer/trajectory
  path_optimizer:
    # Phase 41.5 mapper hint: medium — mid-pipeline planning stage (path
    # geometry refinement), not the closed control loop and not a
    # non-causal monitor; degraded timing here is absorbed by downstream
    # velocity planning margin before it reaches actuation.
    criticality: medium
    sub:
      input_path:               # path_smoother/path — chained from smoother
        min_rate_hz: 10
      odometry:                 # /localization/kinematic_state — InterProcessPollingSubscriber
        state: true
    pub:
      output_trajectory:        # path_optimizer/trajectory — remap ~/output/path (note: Path→Trajectory)
        min_rate_hz: 10
    paths:
      optimize_path:            # P44 W6: renamed from `main` — see smooth_path comment
        input: input_path
        output: [output_trajectory]
        max_latency: 15ms      # quadratic optimization

  # --- Motion Velocity Planner ---
  # plugin: autoware::motion_velocity_planner::MotionVelocityPlannerNode
  # Remaps: ~/input/trajectory → path_optimizer/trajectory
  #         ~/output/trajectory → $(var interface_output_topic) = lane_driving/trajectory
  motion_velocity_planner:
    # Phase 41.5 mapper hint: medium — final planning-side stage before
    # control (velocity/collision-aware trajectory), but still one hop
    # upstream of the actuation-facing control loop (controller_node_exe,
    # vehicle_cmd_gate — both `criticality: high` in
    # tier4_control_launch/control.contract.yaml).
    criticality: medium
    sub:
      input_trajectory:         # path_optimizer/trajectory — create_subscription QoS(1)
        min_rate_hz: 10
      vector_map:               # /map/vector_map — QoS(10).transient_local()
        state: true
        required: true
      odometry:                 # /localization/kinematic_state — InterProcessPollingSubscriber
        state: true
      acceleration:             # /localization/acceleration — InterProcessPollingSubscriber
        state: true
      predicted_objects:        # $(var input_objects_topic_name) — InterProcessPollingSubscriber
        state: true
      pointcloud:               # $(var input_pointcloud_topic_name) — single_depth_sensor_qos()
        state: true
      traffic_signals:          # /perception/traffic_light_recognition/traffic_signals
        state: true
      occupancy_grid:           # /perception/occupancy_grid_map/map
        state: true
    pub:
      output_trajectory:        # /planning/scenario_planning/lane_driving/trajectory — QoS(1)
        min_rate_hz: 10
      velocity_limit: {}        # /planning/scenario_planning/max_velocity_candidates — QoS(1).transient_local()
      clear_velocity_limit: {}  # /planning/scenario_planning/clear_velocity_limit — QoS(1).transient_local()
    paths:
      plan_velocity:            # P44 W6: renamed from `main` — see smooth_path comment
        input: input_trajectory
        output: [output_trajectory]
        max_latency: 20ms      # includes velocity planning + collision avoidance modules

topics:
  # Smoother → Optimizer (intra-container)
  # relative → /planning/scenario_planning/lane_driving/motion_planning/smoothed_path
  smoothed_path:
    type: autoware_planning_msgs/msg/Path
    pub: [elastic_band_smoother/output_path]
    sub: [path_optimizer/input_path]
    rate_hz: 10
    qos:
      reliability: reliable     # QoS(1) default = reliable (rmw_qos_profile_default)
      depth: 1

  # Optimizer → Velocity Planner (intra-container)
  # relative → /planning/scenario_planning/lane_driving/motion_planning/optimized_trajectory
  optimized_trajectory:
    type: autoware_planning_msgs/msg/Trajectory
    pub: [path_optimizer/output_trajectory]
    sub: [motion_velocity_planner/input_trajectory]
    rate_hz: 10
    qos:
      reliability: reliable     # QoS(1) default = reliable
      depth: 1

  # Cross-scope inputs
  # behavior_planning's output path — sibling scope
  /planning/scenario_planning/lane_driving/behavior_planning/path:
    type: autoware_planning_msgs/msg/Path
    sub: [elastic_band_smoother/input_path]

  /localization/kinematic_state:
    type: nav_msgs/msg/Odometry
    sub:
      - elastic_band_smoother/odometry
      - path_optimizer/odometry
      - motion_velocity_planner/odometry

  # UPSTREAM: motion_velocity_planner subscriber comment in source said QoS(10).transient_local(),
  # but the actual publisher (autoware_map_loader / lanelet2_map_loader_node.cpp:130) uses
  # rclcpp::QoS{1}.transient_local(). Authoritative QoS is the publisher's; the subscriber
  # comment is misleading. Aligned to depth=1 to match publisher and other map subscribers.
  # Source: src/core/autoware_core/map/autoware_map_loader/src/lanelet2_map_loader/lanelet2_map_loader_node.cpp:130
  /map/vector_map:
    type: autoware_map_msgs/msg/LaneletMapBin
    sub: [motion_velocity_planner/vector_map]
    qos:
      reliability: reliable
      durability: transient_local
      depth: 1

  /localization/acceleration:
    type: geometry_msgs/msg/AccelWithCovarianceStamped
    sub: [motion_velocity_planner/acceleration]

  /perception/object_recognition/objects:
    type: autoware_perception_msgs/msg/PredictedObjects
    sub: [motion_velocity_planner/predicted_objects]

  # In planning_simulator the publisher is dummy_perception_publisher (reliable+transient_local).
  /perception/obstacle_segmentation/pointcloud:
    type: sensor_msgs/msg/PointCloud2
    sub: [motion_velocity_planner/pointcloud]
    qos:
      reliability: reliable
      durability: transient_local
      depth: 1

  /perception/traffic_light_recognition/traffic_signals:
    type: autoware_perception_msgs/msg/TrafficLightGroupArray
    sub: [motion_velocity_planner/traffic_signals]

  /perception/occupancy_grid_map/map:
    type: nav_msgs/msg/OccupancyGrid
    sub: [motion_velocity_planner/occupancy_grid]

  # Output trajectory → scenario_selector
  /planning/scenario_planning/lane_driving/trajectory:
    type: autoware_planning_msgs/msg/Trajectory
    pub: [motion_velocity_planner/output_trajectory]
    rate_hz: 10
    qos:
      reliability: reliable           # QoS(1)
      depth: 1

  # Velocity limit candidates / clear command — consumed by external_velocity_limit_selector
  /planning/scenario_planning/max_velocity_candidates:
    type: autoware_internal_planning_msgs/msg/VelocityLimit
    pub: [motion_velocity_planner/velocity_limit]
    qos:
      reliability: reliable
      durability: transient_local
      depth: 1

  /planning/scenario_planning/clear_velocity_limit:
    type: autoware_internal_planning_msgs/msg/VelocityLimitClearCommand
    pub: [motion_velocity_planner/clear_velocity_limit]
    qos:
      reliability: reliable
      durability: transient_local
      depth: 1

paths:
  # Full motion planning pipeline: path → smooth → optimize → velocity plan
  # Scope path I/O are ROS topic names
  motion_planning:
    input: /planning/scenario_planning/lane_driving/behavior_planning/path
    output: [/planning/scenario_planning/lane_driving/trajectory]
    max_latency: 50ms          # sum: 10 (smooth) + 15 (optimize) + 20 (velocity) = 45ms + margin
    # max_age_ms relocated to elastic_band_smoother.sub.input_path (consumer-side)
