# tier4_planning_launch/behavior_planning.launch.xml
# Namespace: /planning/scenario_planning/lane_driving/behavior_planning
#
# Sources:
#   launch:   /opt/autoware/1.5.0/share/tier4_planning_launch/launch/scenario_planning/lane_driving/behavior_planning/behavior_planning.launch.xml
#   path_planner: autoware_universe/planning/behavior_path_planner/autoware_behavior_path_planner/src/behavior_path_planner_node.cpp
#   vel_planner:  autoware_core/planning/behavior_velocity_planner/autoware_behavior_velocity_planner/src/node.cpp

# Args from behavior_planning.launch.xml
# After parser fix (33.1), all resolved args are now in scope.args,
# including those with defaults in the launch XML.
#
# Note: behavior_path_planner_type selects between BehaviorPathPlannerNode
# (default) and PathGenerator. This is a plugin-level condition inside the
# same composable node container — not a node-level if: (see notes.md #7).
args:
  input_objects_topic_name:
  input_pointcloud_topic_name:
  input_traffic_light_topic_name:
  input_vector_map_topic_name:

version: 1

nodes:
  # --- Behavior Path Planner ---
  # plugin: autoware::behavior_path_planner::BehaviorPathPlannerNode
  # Execution: timer-based periodic (planning_hz param), all subs are InterProcessPollingSubscriber
  behavior_path_planner:
    sub:
      route:                        # /planning/mission_planning/route — QoS(1).transient_local()
        state: true
        required: true
        max_age: 300ms             # E2E freshness incl. upstream route + perception latency
      vector_map:                   # /map/vector_map — QoS(1).transient_local()
        state: true
        required: true
      predicted_objects:            # $(input_objects_topic_name) — InterProcessPollingSubscriber, QoS(1)
        state: true
      costmap:                      # /planning/scenario_planning/parking/costmap_generator/occupancy_grid — QoS(1)
        state: true
      odometry:                     # /localization/kinematic_state — InterProcessPollingSubscriber, QoS(1)
        state: true
      acceleration:                 # /localization/acceleration — InterProcessPollingSubscriber, QoS(1)
        state: true
      scenario:                     # /planning/scenario_planning/scenario — InterProcessPollingSubscriber, QoS(1)
        state: true
      traffic_signals:              # $(input_traffic_light_topic_name) — InterProcessPollingSubscriber, QoS(1)
        state: true
      occupancy_grid:               # /perception/occupancy_grid_map/map — InterProcessPollingSubscriber, QoS(1)
        state: true
    pub:
      path_with_lane_id:            # path_with_lane_id (intra-container to velocity planner) — QoS(1)
        min_rate_hz: 10             # driven by planning_hz timer param
      turn_indicators_cmd: {}       # /planning/turn_indicators_cmd — QoS(1)
      hazard_lights_cmd: {}         # /planning/behavior_path_planner/hazard_lights_cmd — QoS(1)
      modified_goal: {}             # /planning/scenario_planning/modified_goal — QoS(1).transient_local()
    paths:
      periodic:
        # Timer at planning_hz (10 Hz default;
        # autoware_behavior_path_planner/config/behavior_path_planner.param.yaml:5),
        # created behavior_path_planner_node.cpp:140-145; all 9 subs above are
        # InterProcessPollingSubscriber / lambda take-latest, sampled in
        # takeData() at the top of run() (behavior_path_planner_node.cpp:
        # 174-261), gated by isDataReady(). P44 W3 census.
        trigger: { timer: { rate_hz: 10 } }
        output: [path_with_lane_id]
        max_latency: 50ms          # planning cycle budget

  # --- Behavior Velocity Planner ---
  # plugin: autoware::behavior_velocity_planner::experimental::BehaviorVelocityPlannerNode
  # Execution: event-driven (triggered by path_with_lane_id callback), not timer
  behavior_velocity_planner:
    sub:
      path_with_lane_id:            # path_with_lane_id — TRIGGER subscription (callback-based), QoS(1)
        min_rate_hz: 10
      vector_map:                   # $(input_vector_map_topic_name) — QoS(1).transient_local()
        state: true
        required: true
      odometry:                     # /localization/kinematic_state — InterProcessPollingSubscriber, QoS(1)
        state: true
      acceleration:                 # /localization/acceleration — InterProcessPollingSubscriber, QoS(1)
        state: true
      predicted_objects:            # $(input_objects_topic_name) — InterProcessPollingSubscriber, QoS(1)
        state: true
      pointcloud:                   # $(input_pointcloud_topic_name) — single_depth_sensor_qos()
        state: true
      traffic_signals:              # $(input_traffic_light_topic_name) — InterProcessPollingSubscriber, QoS(1)
        state: true
      occupancy_grid:               # /perception/occupancy_grid_map/map — InterProcessPollingSubscriber, QoS(1)
        state: true
      external_velocity_limit:      # /planning/scenario_planning/max_velocity_default — QoS(1).transient_local()
        state: true
    pub:
      output_path:                  # path (remapped ~/output/path) — QoS(1)
        min_rate_hz: 10
    paths:
      main:                         # event-driven: triggered by path_with_lane_id arrival
        input: path_with_lane_id
        output: [output_path]
        max_latency: 30ms          # velocity planning + scene module processing

topics:
  # Path Planner → Velocity Planner (intra-container)
  # relative → /planning/scenario_planning/lane_driving/behavior_planning/path_with_lane_id
  path_with_lane_id:
    type: autoware_internal_planning_msgs/msg/PathWithLaneId
    pub: [behavior_path_planner/path_with_lane_id]
    sub: [behavior_velocity_planner/path_with_lane_id]
    rate_hz: 10
    qos:                            # intra-container — may bypass DDS
      depth: 1

  # Cross-scope inputs
  /planning/mission_planning/route:
    type: autoware_planning_msgs/msg/LaneletRoute
    sub: [behavior_path_planner/route]
    qos:
      reliability: reliable           # QoS(1).transient_local()
      durability: transient_local
      depth: 1

  /map/vector_map:
    type: autoware_map_msgs/msg/LaneletMapBin
    sub:
      - behavior_path_planner/vector_map
      - behavior_velocity_planner/vector_map
    qos:
      reliability: reliable           # QoS(1).transient_local()
      durability: transient_local
      depth: 1

  # Predicted objects — from perception/prediction pipeline
  # Topic name is provided via launch arg input_objects_topic_name (typically /perception/object_recognition/objects)
  /perception/object_recognition/objects:
    type: autoware_perception_msgs/msg/PredictedObjects
    sub:
      - behavior_path_planner/predicted_objects
      - behavior_velocity_planner/predicted_objects
    qos:
      reliability: reliable           # QoS(1)
      depth: 1

  /localization/kinematic_state:
    type: nav_msgs/msg/Odometry
    sub:
      - behavior_path_planner/odometry
      - behavior_velocity_planner/odometry
    qos:
      reliability: reliable           # QoS(1)
      depth: 1

  /localization/acceleration:
    type: geometry_msgs/msg/AccelWithCovarianceStamped
    sub:
      - behavior_path_planner/acceleration
      - behavior_velocity_planner/acceleration
    qos:
      reliability: reliable           # QoS(1)
      depth: 1

  # Traffic light recognition — input topic via launch arg input_traffic_light_topic_name
  /perception/traffic_light_recognition/traffic_signals:
    type: autoware_perception_msgs/msg/TrafficLightGroupArray
    sub:
      - behavior_path_planner/traffic_signals
      - behavior_velocity_planner/traffic_signals
    qos:
      reliability: reliable           # QoS(1)
      depth: 1

  /perception/occupancy_grid_map/map:
    type: nav_msgs/msg/OccupancyGrid
    sub:
      - behavior_path_planner/occupancy_grid
      - behavior_velocity_planner/occupancy_grid
    qos:
      reliability: reliable           # QoS(1)
      depth: 1

  # No-ground pointcloud — sensor data, topic name from input_pointcloud_topic_name
  # In planning_simulator the publisher is dummy_perception_publisher (reliable+transient_local).
  # behavior_velocity_planner uses single_depth_sensor_qos (best_effort) — DDS-compatible because
  # offered reliable+durable ≥ requested best_effort+volatile.
  /perception/obstacle_segmentation/pointcloud:
    type: sensor_msgs/msg/PointCloud2
    sub: [behavior_velocity_planner/pointcloud]
    qos:
      reliability: reliable
      durability: transient_local
      depth: 1

  # Parking costmap
  /planning/scenario_planning/parking/costmap_generator/occupancy_grid:
    type: nav_msgs/msg/OccupancyGrid
    sub: [behavior_path_planner/costmap]
    qos:
      reliability: reliable           # QoS(1)
      depth: 1

  # Scenario selection
  # Source: src/universe/autoware_universe/planning/autoware_scenario_selector/src/node.cpp:482
  # type is autoware_internal_planning_msgs/msg/Scenario (not tier4_planning_msgs/Scenario).
  /planning/scenario_planning/scenario:
    type: autoware_internal_planning_msgs/msg/Scenario
    sub: [behavior_path_planner/scenario]
    qos:
      reliability: reliable           # QoS(1)
      depth: 1

  # External velocity limit — QoS(1).transient_local()
  /planning/scenario_planning/max_velocity_default:
    type: autoware_internal_planning_msgs/msg/VelocityLimit
    sub: [behavior_velocity_planner/external_velocity_limit]
    qos:
      reliability: reliable
      durability: transient_local
      depth: 1

  # Behavior planning output path (consumed by motion_planning)
  # relative → /planning/scenario_planning/lane_driving/behavior_planning/path
  path:
    type: autoware_planning_msgs/msg/Path
    pub: [behavior_velocity_planner/output_path]
    rate_hz: 10
    qos:
      reliability: reliable           # QoS(1)
      depth: 1

  # Other publishers (no in-scope subscribers; declared so they appear in the graph)
  /planning/turn_indicators_cmd:
    type: autoware_vehicle_msgs/msg/TurnIndicatorsCommand
    pub: [behavior_path_planner/turn_indicators_cmd]
    qos:
      reliability: reliable           # QoS(1)
      depth: 1

  # Source remap: behavior_planning.launch.xml:244
  #   ~/output/hazard_lights_cmd → /planning/behavior_path_planner/hazard_lights_cmd
  # Consumed by autoware_hazard_lights_selector (input_hazard_lights_cmd_from_path_planner).
  /planning/behavior_path_planner/hazard_lights_cmd:
    type: autoware_vehicle_msgs/msg/HazardLightsCommand
    pub: [behavior_path_planner/hazard_lights_cmd]
    qos:
      reliability: reliable           # QoS(1)
      depth: 1

  /planning/scenario_planning/modified_goal:
    type: geometry_msgs/msg/PoseWithUuidStamped
    pub: [behavior_path_planner/modified_goal]
    qos:
      reliability: reliable           # QoS(1).transient_local()
      durability: transient_local
      depth: 1

paths:
  # Full behavior planning: periodic path gen → event-driven velocity planning
  # Scope path I/O are ROS topic names (not group names)
  behavior:
    input: /planning/mission_planning/route
    output: [path]                  # relative → /planning/scenario_planning/lane_driving/behavior_planning/path
    max_latency: 100ms             # path planner (50ms) + velocity planner (30ms) + margin
    # max_age_ms relocated to behavior_velocity_planner.sub.external_velocity_limit (consumer-side)
