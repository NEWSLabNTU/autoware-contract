# tier4_planning_launch/scenario_planning/lane_driving.launch.xml
# Namespace: /planning/scenario_planning/lane_driving
#
# Lane driving pipeline: behavior planning → motion planning.
#
# Source: /opt/autoware/1.5.0/share/tier4_planning_launch/launch/scenario_planning/lane_driving.launch.xml

args:
  input_objects_topic_name:
  input_pointcloud_topic_name:

version: 1

includes:
  behavior_planning:
    manifest: tier4_planning_launch/behavior_planning.yaml
  motion_planning:
    manifest: tier4_planning_launch/motion_planning.yaml

sub:
  route:
    - behavior_planning/route
  vector_map:
    - behavior_planning/vector_map
  odometry:
    - behavior_planning/odometry
    - motion_planning/odometry
  predicted_objects:
    - behavior_planning/predicted_objects
    - motion_planning/predicted_objects
  pointcloud:
    - behavior_planning/pointcloud
    - motion_planning/pointcloud

pub:
  trajectory:
    - motion_planning/trajectory
