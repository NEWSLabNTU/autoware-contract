# tier4_perception_launch/object_recognition/detection/detection.launch.xml
# Namespace: /perception/object_recognition/detection
#
# Object detection: mode-based pipeline selection (camera, lidar, fusion
# variants). Complex conditional tree with 60+ args.
#
# Source: /opt/autoware/1.5.0/share/tier4_perception_launch/launch/object_recognition/detection/detection.launch.xml
#
# Note: This launch file has extensive conditional logic selecting between
# detector configurations (camera_lidar_fusion, lidar, radar, etc.).
# The manifest documents the common output interface; internal pipeline
# selection is mode-dependent and not modeled with if: conditions.

version: 1

# Leaf manifests for the various detector backends (centerpoint, apollo,
# camera fusion, etc.) are not yet authored. This file currently captures
# only the scope's input/output topic surface as placeholders so the
# graph wiring can be expressed once those leaves land.

topics:
  # /perception/obstacle_segmentation/pointcloud — input from ground segmentation
  # In planning_simulator, this topic comes from dummy_perception_publisher (QoS(1).transient_local()).
  /perception/obstacle_segmentation/pointcloud:
    type: sensor_msgs/msg/PointCloud2
    qos:
      reliability: reliable
      durability: transient_local
      depth: 1
    # sub: filled in once detector leaf manifests are authored

  # relative — /perception/object_recognition/detection/objects (output to tracking)
  # Type confirmed by Phase 36 runtime enforcement (live snapshot).
  objects:
    type: autoware_perception_msgs/msg/DetectedObjects
    # pub: filled in once detector leaf manifests are authored
