version: 1

# Production-deployment ground filter wiring (not exercised by
# planning_simulator, which uses dummy_perception_publisher for the
# /perception/obstacle_segmentation/pointcloud topic). The scan
# ground filter is the default Autoware implementation; other
# variants (ransac, ray_ground_filter) share the same input/output
# interface and can be added as alternative includes.

includes:
  scan_ground_filter:
    manifest: autoware_ground_segmentation/scan_ground_filter.yaml
