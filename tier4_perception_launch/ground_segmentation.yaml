# tier4_perception_launch/obstacle_segmentation/ground_segmentation/ground_segmentation.launch.py
# Namespace: /perception/obstacle_segmentation
#
# Ground point filtering for obstacle detection.
#
# Source: /opt/autoware/1.5.0/share/tier4_perception_launch/launch/obstacle_segmentation/ground_segmentation/ground_segmentation.launch.py

version: 1

# Leaf manifests for the ground segmentation composable nodes
# (ransac_ground_filter, scan_ground_filter, etc.) are not yet authored.
# This file currently captures only the scope's input/output topic
# surface as placeholders so the graph wiring can be expressed once
# those leaves land.

topics:
  # /sensing/lidar/concatenated/pointcloud — sensor input (cross-scope)
  # TODO: confirm exact source topic name once detector leaves are authored
  /sensing/lidar/concatenated/pointcloud:
    type: sensor_msgs/msg/PointCloud2
    qos:
      reliability: best_effort                  # SensorDataQoS
      depth: 1
    # sub: filled in once leaf manifests are authored

  # relative — /perception/obstacle_segmentation/pointcloud (filtered output)
  # In planning_simulator, this topic is published by autoware_dummy_perception_publisher
  # (QoS(1).transient_local()), not by a real ground filter. See
  # autoware_dummy_perception_publisher/dummy_perception_publisher.yaml.
  pointcloud:
    type: sensor_msgs/msg/PointCloud2
    qos:
      reliability: reliable
      durability: transient_local
      depth: 1
    # pub: filled in once leaf manifests are authored (real ground-filter pipeline)
