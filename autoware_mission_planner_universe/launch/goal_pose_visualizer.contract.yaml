# autoware_mission_planner_universe/goal_pose_visualizer.launch.xml
# Namespace: /planning/mission_planning
#
# Sources:
#   source: autoware_universe/planning/autoware_mission_planner_universe/src/goal_pose_visualizer/
version: 1

nodes:
  goal_pose_visualizer:
    # Phase 41.5 mapper hint: low — pure visualization echo (route -> RViz
    # goal-pose marker), no actuation or planning consequence if delayed.
    criticality: low
    sub:
      input_route:                              # input/route → /planning/mission_planning/route
        state: true                             # QoS transient_local
    pub:
      output_goal_pose: {}                      # output/goal_pose → /planning/mission_planning/echo_back_goal_pose

topics:
  # absolute — input/route → /planning/mission_planning/route (sub-only, published by mission_planner)
  /planning/mission_planning/route:
    type: autoware_planning_msgs/msg/LaneletRoute
    sub: [goal_pose_visualizer/input_route]
    qos:
      reliability: reliable           # QoS transient_local in source
      durability: transient_local
      depth: 1

  # absolute — output/goal_pose → /planning/mission_planning/echo_back_goal_pose
  /planning/mission_planning/echo_back_goal_pose:
    type: geometry_msgs/msg/PoseStamped
    pub: [goal_pose_visualizer/output_goal_pose]
