# autoware_mission_planner_universe/mission_planner.launch.xml
# Namespace: /planning/mission_planning
#
# Sources:
#   launch:         /opt/autoware/1.5.0/share/autoware_mission_planner_universe/launch/mission_planner.launch.xml
#   mission_planner: autoware_universe/planning/autoware_mission_planner_universe/src/mission_planner/mission_planner.hpp
#   route_selector:  autoware_universe/planning/autoware_mission_planner_universe/src/route_selector/route_selector.hpp
version: 1

nodes:
  # --- Mission Planner ---
  # plugin: autoware::mission_planner_universe::MissionPlanner
  # Loaded in mission_planner_container (component_container_mt)
  mission_planner:
    sub:
      vector_map:                   # /map/vector_map — QoS(1).transient_local()
        state: true
        required: true
      modified_goal:                # /planning/scenario_planning/modified_goal — QoS(1).transient_local()
        state: true
      odometry:                     # /localization/kinematic_state — QoS(1)
        state: true
      operation_mode:               # /system/operation_mode/state — QoS(1).transient_local()
        state: true
    pub:
      route: {}                     # route (intra-container to route_selector) — QoS(1).transient_local()
      state: {}                     # state (intra-container to route_selector) — QoS(1).transient_local()
    srv:
      clear_route: {}               # mission_planner/clear_route — ClearRoute
      set_lanelet_route: {}         # mission_planner/set_lanelet_route — SetLaneletRoute
      set_waypoint_route: {}        # mission_planner/set_waypoint_route — SetWaypointRoute

  # --- Route Selector ---
  # plugin: autoware::mission_planner_universe::RouteSelector
  # Arbitrates between main route and MRM (minimal risk maneuver) route
  route_selector:
    sub:
      planner_route:                # route (from mission_planner) — QoS(1).transient_local()
        state: true
      planner_state:                # state (from mission_planner) — QoS(1).transient_local()
        state: true
    pub:
      main_route: {}                # ~/main/route — QoS(1).transient_local()
      main_state: {}                # ~/main/state — QoS(1).transient_local()
      mrm_route: {}                 # ~/mrm/route — QoS(1).transient_local()
      mrm_state: {}                 # ~/mrm/state — QoS(1).transient_local()
    srv:
      clear_route: {}               # proxies to mission_planner
      set_lanelet_route: {}
      set_waypoint_route: {}

topics:
  # Mission Planner → Route Selector (intra-container, transient_local)
  planner_route:
    type: autoware_planning_msgs/msg/LaneletRoute
    pub: [mission_planner/route]
    sub: [route_selector/planner_route]
    qos:
      reliability: reliable         # QoS(1).transient_local()
      durability: transient_local
      depth: 1

  planner_state:
    type: autoware_planning_msgs/msg/RouteState
    pub: [mission_planner/state]
    sub: [route_selector/planner_state]
    qos:
      reliability: reliable
      durability: transient_local
      depth: 1

imports:
  # /map/vector_map — QoS(1).transient_local()
  vector_map:
    - mission_planner/vector_map
  # /localization/kinematic_state — QoS(1)
  odometry:
    - mission_planner/odometry
  # /planning/scenario_planning/modified_goal — QoS(1).transient_local()
  modified_goal:
    - mission_planner/modified_goal
  # /system/operation_mode/state — QoS(1).transient_local()
  operation_mode:
    - mission_planner/operation_mode

exports:
  # ~/main/route → consumed by behavior_path_planner as /planning/mission_planning/route
  route:
    - route_selector/main_route
