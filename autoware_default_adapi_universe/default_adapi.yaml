version: 1
# 19 composable nodes — all are ADAPI bridge adapters.
# They translate between internal Autoware topics and the standard ADAPI interface.
# Grouped as a single scope; individual node contracts are lightweight (state reads + service bridges).
nodes:
  interface_node:
    pub: [interface_version]
  localization_node:
    sub: { kinematic_state: { state: true } }
    pub: [localization_state]
  routing_node:
    sub: { route: { state: true } }
    pub: [routing_state, routing_route]
  autoware_state_node:
    sub:
      localization_state: { state: true }
      routing_state: { state: true }
      operation_mode: { state: true }
      mrm_state: { state: true }
    pub: [autoware_state]
  diagnostics_node:
    sub: { diagnostic_graph: { state: true } }
    pub: [diagnostics_status, diagnostics_struct]
  fail_safe_node:
    sub: { mrm_state: { state: true } }
    pub: [fail_safe_state]
  heartbeat_node:
    pub: [heartbeat]
  motion_node:
    sub: { vehicle_status: { state: true } }
    pub: [motion_state]
  operation_mode_node:
    sub: { operation_mode_internal: { state: true } }
    pub: [operation_mode]
  perception_node:
    sub: { predicted_objects: { state: true } }
    pub: [perception_state]
  planning_node:
    sub: { trajectory: { state: true } }
    pub: [planning_state, steering_factors, velocity_factors]
  vehicle_status_node:
    sub:
      velocity_status: { state: true }
      steering_status: { state: true }
      gear_status: { state: true }
      turn_indicators_status: { state: true }
      hazard_lights_status: { state: true }
    pub: [vehicle_status]
  vehicle_command_node:
    sub: { control_cmd: { state: true } }
    pub: [vehicle_command]
  vehicle_metrics_node:
    sub: { kinematic_state: { state: true } }
    pub: [vehicle_metrics, vehicle_kinematics]
  vehicle_info_node:
    pub: [vehicle_info]
  vehicle_door_node:
    sub: { door_status: { state: true } }
    pub: [door_state]
  mrm_request_node:
    sub: { mrm_request: { state: true } }
    pub: [mrm_state, mrm_request_list]
  manual_local_node:
    sub: { operation_mode: { state: true } }
    pub: []
  manual_remote_node:
    sub: { operation_mode: { state: true } }
    pub: []

# Cross-scope publisher decls — these absolute topics are published by the
# adapi nodes and consumed across the system. Source citations refer to the
# adapi_specs (immutable name/QoS contract).
#
# Source (operation_mode publisher): autoware_universe/system/autoware_default_adapi_universe/src/operation_mode.cpp:32 — adaptor.init_pub(pub_state_)
# Source (spec/QoS): autoware_core/api/autoware_adapi_specs/include/autoware/adapi_specs/operation_mode.hpp:62-69 — name="/api/operation_mode/state", depth=1, reliable, transient_local
topics:
  # All ADAPI state publishers follow the same QoS contract specified in
  # autoware_adapi_specs: reliable + transient_local + depth=1. Late
  # subscribers (rqt, web UIs, external monitoring) receive the last
  # state automatically. Source: autoware_core/api/autoware_adapi_specs/
  # include/autoware/adapi_specs/*.hpp — each spec class sets the same
  # `RELIABLE_TRANSIENT_LOCAL(1)` profile.
  /api/operation_mode/state:
    type: autoware_adapi_v1_msgs/msg/OperationModeState
    pub: [operation_mode_node/operation_mode]
    qos:
      reliability: reliable
      durability: transient_local
      depth: 1

  /api/routing/state:
    type: autoware_adapi_v1_msgs/msg/RouteState
    pub: [routing_node/routing_state]
    qos:
      reliability: reliable
      durability: transient_local
      depth: 1

  /api/localization/initialization_state:
    type: autoware_adapi_v1_msgs/msg/LocalizationInitializationState
    pub: [localization_node/localization_state]
    qos:
      reliability: reliable
      durability: transient_local
      depth: 1

  /api/fail_safe/mrm_state:
    type: autoware_adapi_v1_msgs/msg/MrmState
    pub: [fail_safe_node/fail_safe_state]
    qos:
      reliability: reliable
      durability: transient_local
      depth: 1

  /api/motion/state:
    type: autoware_adapi_v1_msgs/msg/MotionState
    pub: [motion_node/motion_state]
    qos:
      reliability: reliable
      durability: transient_local
      depth: 1

  /api/system/heartbeat:
    type: autoware_adapi_v1_msgs/msg/Heartbeat
    pub: [heartbeat_node/heartbeat]
    qos:
      reliability: reliable
      durability: transient_local
      depth: 1

  /api/vehicle/status:
    type: autoware_adapi_v1_msgs/msg/VehicleStatus
    pub: [vehicle_status_node/vehicle_status]
    qos:
      reliability: reliable
      durability: transient_local
      depth: 1

  /api/vehicle/metrics:
    type: autoware_adapi_v1_msgs/msg/VehicleMetrics
    pub: [vehicle_metrics_node/vehicle_metrics]
    qos:
      reliability: reliable
      durability: transient_local
      depth: 1

  /api/vehicle/doors/status:
    type: autoware_adapi_v1_msgs/msg/DoorStatusArray
    pub: [vehicle_door_node/door_state]
    qos:
      reliability: reliable
      durability: transient_local
      depth: 1

  /api/routing/route:
    type: autoware_adapi_v1_msgs/msg/Route
    pub: [routing_node/routing_route]
    qos:
      reliability: reliable
      durability: transient_local
      depth: 1

  /api/system/diagnostics/status:
    type: autoware_adapi_v1_msgs/msg/DiagGraphStatus
    pub: [diagnostics_node/diagnostics_status]
    qos:
      reliability: reliable
      durability: transient_local
      depth: 1

  /api/system/diagnostics/struct:
    type: autoware_adapi_v1_msgs/msg/DiagGraphStruct
    pub: [diagnostics_node/diagnostics_struct]
    qos:
      reliability: reliable
      durability: transient_local
      depth: 1

  /api/planning/steering_factors:
    type: autoware_adapi_v1_msgs/msg/SteeringFactorArray
    pub: [planning_node/steering_factors]
    qos:
      reliability: reliable
      durability: transient_local
      depth: 1

  /api/planning/velocity_factors:
    type: autoware_adapi_v1_msgs/msg/VelocityFactorArray
    pub: [planning_node/velocity_factors]
    qos:
      reliability: reliable
      durability: transient_local
      depth: 1

  /api/vehicle/kinematics:
    type: autoware_adapi_v1_msgs/msg/VehicleKinematics
    pub: [vehicle_metrics_node/vehicle_kinematics]
    qos:
      reliability: reliable
      durability: transient_local
      depth: 1

  /api/perception/objects:
    type: autoware_adapi_v1_msgs/msg/DynamicObjectArray
    pub: [perception_node/perception_state]
    qos:
      reliability: reliable
      durability: transient_local
      depth: 1

  /api/fail_safe/mrm_request/list:
    type: autoware_adapi_v1_msgs/msg/MrmRequestList
    pub: [mrm_request_node/mrm_request_list]
    qos:
      reliability: reliable
      durability: transient_local
      depth: 1
