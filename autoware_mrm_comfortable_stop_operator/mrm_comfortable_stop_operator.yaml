# autoware_mrm_comfortable_stop_operator/mrm_comfortable_stop_operator.launch.py
# Namespace: /system
#
# Sources:
#   source: autoware_universe/system/autoware_mrm_comfortable_stop_operator/src/mrm_comfortable_stop_operator.cpp
version: 1

nodes:
  mrm_comfortable_stop_operator:
    pub:
      mrm_status: {}                            # ~/output/mrm/comfortable_stop/status — QoS(1)
      velocity_limit: {}                        # ~/output/velocity_limit — QoS(1).transient_local()
      velocity_limit_clear: {}                  # ~/output/velocity_limit/clear — QoS(1).transient_local()
    srv:
      operate:                                  # ~/input/mrm/comfortable_stop/operate — OperateMrm
        # safety-critical — no documented response time requirement
services:
  operate:
    type: tier4_system_msgs/srv/OperateMrm
    server: [mrm_comfortable_stop_operator/operate]
    # client is mrm_handler (cross-scope)

pub:
  mrm_status: [mrm_comfortable_stop_operator/mrm_status]
