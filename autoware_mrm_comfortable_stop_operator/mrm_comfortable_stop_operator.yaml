# autoware_mrm_comfortable_stop_operator/mrm_comfortable_stop_operator.launch.py
# Namespace: /system
#
# Sources:
#   source: autoware_universe/system/autoware_mrm_comfortable_stop_operator/src/mrm_comfortable_stop_operator.cpp
version: 1

nodes:
  mrm_comfortable_stop_operator:
    pub:
      mrm_status: {}                            # ~/output/mrm/comfortable_stop/status — QoS(1)
      velocity_limit: {}                        # ~/output/velocity_limit — QoS(1).transient_local()
      velocity_limit_clear: {}                  # ~/output/velocity_limit/clear — QoS(1).transient_local()
    srv:
      operate:                                  # ~/input/mrm/comfortable_stop/operate — OperateMrm
        # safety-critical — no documented response time requirement

topics:
  # relative → /system/mrm/comfortable_stop/status
  mrm/comfortable_stop/status:
    type: tier4_system_msgs/msg/MrmBehaviorStatus  # declared from upstream msg pkg / cross-leaf consistency
    pub: [mrm_comfortable_stop_operator/mrm_status]
    qos:
      reliability: reliable           # QoS(1)
      depth: 1

  # relative → /system/velocity_limit (consumed by external_velocity_limit_selector)
  # Source: autoware_universe/system/autoware_mrm_comfortable_stop_operator/src/mrm_comfortable_stop_operator_core.cpp
  velocity_limit:
    type: autoware_internal_planning_msgs/msg/VelocityLimit
    pub: [mrm_comfortable_stop_operator/velocity_limit]
    qos:
      reliability: reliable
      durability: transient_local
      depth: 1

  # relative → /system/velocity_limit/clear
  velocity_limit/clear:
    type: autoware_internal_planning_msgs/msg/VelocityLimitClearCommand
    pub: [mrm_comfortable_stop_operator/velocity_limit_clear]
    qos:
      reliability: reliable
      durability: transient_local
      depth: 1

services:
  # relative → /system/mrm/comfortable_stop/operate
  mrm/comfortable_stop/operate:
    type: tier4_system_msgs/srv/OperateMrm
    server: [mrm_comfortable_stop_operator/operate]
    # client is mrm_handler (cross-scope, declared in tier4_system_launch/system.yaml)
