# autoware_shape_estimation/shape_estimation.launch.xml
# Namespace: /simulation
#
# Sources:
#   source: autoware_universe/perception/autoware_shape_estimation/
version: 1

nodes:
  shape_estimation:
    sub:
      input:                                    # input → /perception/object_recognition/detection/labeled_clusters
        min_rate_hz: 10
    pub:
      objects_with_shape:                       # objects → /perception/object_recognition/detection/objects_with_feature
        min_rate_hz: 10
    paths:
      main:
        input: input
        output: [objects_with_shape]
        max_latency: 10ms                      # shape fitting per object

topics:
  # absolute — input from upstream perception (remap: input → /perception/object_recognition/detection/labeled_clusters)
  # In planning_simulator the publisher is autoware_dummy_perception_publisher (real=true branch).
  # Source (pub): autoware_dummy_perception_publisher/src/node.cpp:97-99 — QoS(1).transient_local()
  /perception/object_recognition/detection/labeled_clusters:
    type: tier4_perception_msgs/msg/DetectedObjectsWithFeature
    sub: [shape_estimation/input]
    qos:
      reliability: reliable
      durability: transient_local
      depth: 1

  # absolute — shape-augmented detected objects (remap: objects → /perception/object_recognition/detection/objects_with_feature)
  # Source: src/universe/autoware_universe/perception/autoware_shape_estimation/src/shape_estimation_node.cpp:47
  # publisher type confirmed: tier4_perception_msgs::msg::DetectedObjectsWithFeature
  # (the existing autoware_perception_msgs/msg/DetectedObjects was a manifest authoring error —
  # the topic name suffix _with_feature signals the WithFeature variant from tier4_perception_msgs).
  /perception/object_recognition/detection/objects_with_feature:
    type: tier4_perception_msgs/msg/DetectedObjectsWithFeature
    pub: [shape_estimation/objects_with_shape]
    rate_hz: 10
    qos:
      reliability: reliable           # QoS(1)
      depth: 1
